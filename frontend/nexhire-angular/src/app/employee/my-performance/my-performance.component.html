<div class="page-container">
  <div class="page-header">
    <h2>My Performance</h2>
    <p-button label="Submit Self Review" icon="pi pi-star" (onClick)="openSelfReview()"></p-button>
  </div>
  <p-table [value]="reviews" [loading]="loading" stripedRows>
    <ng-template pTemplate="header"><tr><th>Period</th><th>Self Rating</th><th>Manager Rating</th><th>Self Comments</th><th>Manager Feedback</th><th>Status</th></tr></ng-template>
    <ng-template pTemplate="body" let-r>
      <tr>
        <td>{{ monthName(r.month) }} {{ r.year }}</td>
        <td><p-rating [(ngModel)]="r.selfRating" [readonly]="true"></p-rating></td>
        <td>
          <p-rating *ngIf="r.managerRating > 0" [(ngModel)]="r.managerRating" [readonly]="true"></p-rating>
          <span *ngIf="r.managerRating === 0" class="text-muted">Awaiting...</span>
        </td>
        <td>{{ r.selfComments }}</td>
        <td>{{ r.managerComments || '—' }}</td>
        <td><p-tag [value]="r.status" [severity]="r.status==='Reviewed'?'success':'warn'"></p-tag></td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage"><tr><td colspan="6" class="text-center">No performance reviews yet</td></tr></ng-template>
  </p-table>

  <p-dialog [(visible)]="showDialog" header="Submit Self Performance Review" [modal]="true" [style]="{ width: '440px' }">
    <div class="form-grid">
      <div class="field">
        <label>Self Rating (1-5)</label>
        <p-rating [(ngModel)]="selfRating"></p-rating>
      </div>
      <div class="field">
        <label>Comments / Achievements</label>
        <textarea pTextarea [(ngModel)]="selfComments" rows="3" class="w-full" placeholder="Describe your achievements this month..."></textarea>
      </div>
      <div class="field">
        <label>Goals for Next Month</label>
        <textarea pTextarea [(ngModel)]="goals" rows="2" class="w-full" placeholder="Set your targets..."></textarea>
      </div>
    </div>
    <ng-template pTemplate="footer">
      <p-button label="Cancel" severity="secondary" (onClick)="showDialog=false"></p-button>
      <p-button label="Submit Review" (onClick)="submit()"></p-button>
    </ng-template>
  </p-dialog>
</div>
