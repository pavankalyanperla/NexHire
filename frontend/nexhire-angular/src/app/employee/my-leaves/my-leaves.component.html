<div class="page-container">
  <div class="page-header">
    <h2>My Leaves</h2>
    <p-button label="Apply Leave" icon="pi pi-plus" (onClick)="openApply()"></p-button>
  </div>
  <p-table [value]="leaves" [loading]="loading" stripedRows>
    <ng-template pTemplate="header"><tr><th>Type</th><th>From</th><th>To</th><th>Reason</th><th>Applied</th><th>Status</th></tr></ng-template>
    <ng-template pTemplate="body" let-l>
      <tr>
        <td><p-tag [value]="l.leaveType" severity="info"></p-tag></td>
        <td>{{ l.fromDate | date:'dd MMM yyyy' }}</td>
        <td>{{ l.toDate | date:'dd MMM yyyy' }}</td>
        <td>{{ l.reason }}</td>
        <td>{{ l.appliedAt | date:'dd MMM' }}</td>
        <td><p-tag [value]="l.status" [severity]="getSeverity(l.status)"></p-tag></td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage"><tr><td colspan="6" class="text-center">No leave applications yet</td></tr></ng-template>
  </p-table>

  <p-dialog [(visible)]="showDialog" header="Apply for Leave" [modal]="true" [style]="{ width: '400px' }">
    <div class="form-grid">
      <div class="field">
        <label>Leave Type</label>
        <p-select [(ngModel)]="form.leaveType" [options]="leaveTypes" class="w-full"></p-select>
      </div>
      <div class="field">
        <label>From Date</label>
        <input pInputText type="date" [(ngModel)]="form.fromDate" class="w-full" />
      </div>
      <div class="field">
        <label>To Date</label>
        <input pInputText type="date" [(ngModel)]="form.toDate" class="w-full" />
      </div>
      <div class="field">
        <label>Reason</label>
        <textarea pTextarea [(ngModel)]="form.reason" rows="3" class="w-full"></textarea>
      </div>
    </div>
    <ng-template pTemplate="footer">
      <p-button label="Cancel" severity="secondary" (onClick)="showDialog=false"></p-button>
      <p-button label="Apply" (onClick)="apply()"></p-button>
    </ng-template>
  </p-dialog>
</div>
