<div class="portal-layout">
  <nav class="portal-navbar">
    <div class="navbar-left"><i class="pi pi-building app-logo-icon"></i><span class="app-logo-text">NexHire</span></div>
    <div class="navbar-right">
      <p-avatar [label]="user?.fullName?.charAt(0) || 'E'" shape="circle" [style]="{ 'background-color': '#3b82f6', 'color': '#fff' }"></p-avatar>
      <span class="user-name">{{ user?.fullName }}</span>
      <span class="role-badge employee-badge">Employee</span>
      <p-button icon="pi pi-sign-out" label="Logout" severity="secondary" [text]="true" (onClick)="logout()"></p-button>
    </div>
  </nav>
  <div class="portal-body">
    <aside class="portal-sidebar">
      <ul class="sidebar-menu">
        <li *ngFor="let item of menuItems" class="sidebar-item">
          <a [routerLink]="item.link" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: item.link === '/employee' }">
            <i [class]="item.icon"></i><span>{{ item.label }}</span>
          </a>
        </li>
      </ul>
    </aside>
    <main class="portal-main"><router-outlet></router-outlet></main>
  </div>
</div>

<!-- AI HR Chatbot — always present in Employee portal -->
<app-ai-chatbot></app-ai-chatbot>
