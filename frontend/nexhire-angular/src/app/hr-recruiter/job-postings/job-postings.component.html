<div class="page-container">
  <div class="page-header">
    <h2>Job Postings</h2>
    <p-button label="Post New Job" icon="pi pi-plus" (onClick)="showDialog=true; form=emptyForm()"></p-button>
  </div>

  <p-table [value]="jobs" [loading]="loading" stripedRows>
    <ng-template pTemplate="header">
      <tr><th>Title</th><th>Department</th><th>Level</th><th>Type</th><th>Applications</th><th>Status</th><th>Deadline</th><th>Actions</th></tr>
    </ng-template>
    <ng-template pTemplate="body" let-j>
      <tr>
        <td><strong>{{ j.title }}</strong></td>
        <td>{{ j.department }}</td>
        <td>{{ j.experienceLevel }}</td>
        <td>{{ j.jobType }}</td>
        <td><p-badge [value]="j.applicationCount.toString()" severity="info"></p-badge></td>
        <td><p-tag [value]="j.status" [severity]="getSeverity(j.status)"></p-tag></td>
        <td>{{ j.deadline | date:'dd MMM yyyy' }}</td>
        <td>
          <p-button icon="pi pi-users" [text]="true" severity="info" (onClick)="viewCandidates(j.id)" pTooltip="View Candidates"></p-button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage"><tr><td colspan="8" class="text-center">No job postings yet</td></tr></ng-template>
  </p-table>

  <p-dialog [(visible)]="showDialog" header="Post New Job" [modal]="true" [style]="{ width: '560px' }">
    <div class="form-grid">
      <div class="field"><label>Job Title</label><input pInputText [(ngModel)]="form.title" class="w-full" /></div>
      <div class="field"><label>Department</label><input pInputText [(ngModel)]="form.department" class="w-full" /></div>
      <div class="field"><label>Description</label><textarea pTextarea [(ngModel)]="form.description" rows="3" class="w-full"></textarea></div>
      <div class="field"><label>Required Skills (comma separated)</label><input pInputText [(ngModel)]="form.requiredSkills" class="w-full" placeholder="Angular,ASP.NET Core,SQL Server" /></div>
      <div class="field"><label>Experience Level</label><p-select [(ngModel)]="form.experienceLevel" [options]="expLevels" class="w-full"></p-select></div>
      <div class="field"><label>Job Type</label><p-select [(ngModel)]="form.jobType" [options]="jobTypes" class="w-full"></p-select></div>
      <div class="field"><label>Location</label><input pInputText [(ngModel)]="form.location" class="w-full" /></div>
      <div class="field"><label>Salary Min</label><p-inputnumber [(ngModel)]="form.salaryMin" mode="currency" currency="INR" locale="en-IN" class="w-full"></p-inputnumber></div>
      <div class="field"><label>Salary Max</label><p-inputnumber [(ngModel)]="form.salaryMax" mode="currency" currency="INR" locale="en-IN" class="w-full"></p-inputnumber></div>
      <div class="field"><label>Application Deadline</label><input pInputText type="date" [(ngModel)]="form.deadline" class="w-full" /></div>
    </div>
    <ng-template pTemplate="footer">
      <p-button label="Cancel" severity="secondary" (onClick)="showDialog=false"></p-button>
      <p-button label="Post Job" (onClick)="createJob()"></p-button>
    </ng-template>
  </p-dialog>
</div>
