<div class="dashboard-page">
  <div *ngIf="loading"><p-progressSpinner></p-progressSpinner></div>
  <ng-container *ngIf="!loading && overview">
    <div class="stats-grid">
      <div class="stat-card blue">
        <i class="pi pi-users stat-icon"></i>
        <div class="stat-body"><div class="stat-value">{{ overview.totalEmployees }}</div><div class="stat-label">Total Employees</div></div>
      </div>
      <div class="stat-card green">
        <i class="pi pi-user-plus stat-icon"></i>
        <div class="stat-body"><div class="stat-value">+{{ overview.newThisMonth }}</div><div class="stat-label">New This Month</div></div>
      </div>
      <div class="stat-card orange">
        <i class="pi pi-clock stat-icon"></i>
        <div class="stat-body"><div class="stat-value">{{ overview.openLeaveRequests }}</div><div class="stat-label">Open Leaves</div></div>
      </div>
      <div class="stat-card purple">
        <i class="pi pi-check-circle stat-icon"></i>
        <div class="stat-body"><div class="stat-value">{{ overview.todayPresent }}</div><div class="stat-label">Present Today</div></div>
      </div>
    </div>

    <div class="dashboard-grid">
      <p-card header="Today's Attendance">
        <div class="attendance-split">
          <div class="att-block present">
            <div class="att-num">{{ overview.todayPresent }}</div>
            <div class="att-lbl">Present</div>
          </div>
          <div class="att-divider"></div>
          <div class="att-block absent">
            <div class="att-num">{{ overview.todayAbsent }}</div>
            <div class="att-lbl">Absent / On Leave</div>
          </div>
        </div>
      </p-card>

      <p-card header="Department Breakdown">
        <div class="dept-bars">
          <div *ngFor="let d of overview.departmentBreakdown" class="dept-bar-row">
            <span class="dept-name">{{ d.department }}</span>
            <div class="dept-bar-track">
              <div class="dept-bar-fill" [style.width.%]="deptPct(d.count)"></div>
            </div>
            <span class="dept-count">{{ d.count }}</span>
          </div>
        </div>
      </p-card>
    </div>
  </ng-container>
</div>
