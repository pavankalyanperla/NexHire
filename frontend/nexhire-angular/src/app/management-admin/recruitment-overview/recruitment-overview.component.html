<div class="page-container">
  <h2>Recruitment Overview</h2>
  <div *ngIf="loading"><p-progressSpinner></p-progressSpinner></div>
  <ng-container *ngIf="!loading">
    <div class="stats-grid">
      <div class="stat-card blue"><i class="pi pi-briefcase stat-icon"></i><div class="stat-body"><div class="stat-value">{{ openJobs }}</div><div class="stat-label">Open Positions</div></div></div>
      <div class="stat-card purple"><i class="pi pi-users stat-icon"></i><div class="stat-body"><div class="stat-value">{{ totalApplicants }}</div><div class="stat-label">Total Applicants</div></div></div>
    </div>
    <p-table [value]="jobs" stripedRows>
      <ng-template pTemplate="header"><tr><th>Title</th><th>Department</th><th>Level</th><th>Applicants</th><th>Status</th><th>Deadline</th></tr></ng-template>
      <ng-template pTemplate="body" let-j>
        <tr>
          <td><strong>{{ j.title }}</strong></td>
          <td>{{ j.department }}</td>
          <td>{{ j.experienceLevel }}</td>
          <td><p-badge [value]="j.applicationCount.toString()" severity="info"></p-badge></td>
          <td><p-tag [value]="j.status" [severity]="getSeverity(j.status)"></p-tag></td>
          <td>{{ j.deadline | date:'dd MMM yyyy' }}</td>
        </tr>
      </ng-template>
    </p-table>
  </ng-container>
</div>
