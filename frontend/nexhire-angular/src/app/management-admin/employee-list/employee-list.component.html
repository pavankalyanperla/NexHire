<div class="page-container">
  <div class="page-header">
    <h2>Employee Management</h2>
    <p-button label="Add Employee" icon="pi pi-plus" (onClick)="openCreate()"></p-button>
  </div>

  <div class="search-bar">
    <input pInputText placeholder="Search by name, department or code..." [(ngModel)]="search" (input)="applyFilter()" class="w-full" />
  </div>

  <p-table [value]="filtered" [loading]="loading" stripedRows>
    <ng-template pTemplate="header">
      <tr>
        <th>Code</th><th>Name</th><th>Email</th><th>Department</th>
        <th>Designation</th><th>Role</th><th>Status</th><th>Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-e>
      <tr>
        <td><strong>{{ e.employeeCode }}</strong></td>
        <td>{{ e.fullName }}</td>
        <td>{{ e.email }}</td>
        <td>{{ e.department }}</td>
        <td>{{ e.designation }}</td>
        <td><p-tag [value]="e.role" severity="info"></p-tag></td>
        <td><p-tag [value]="e.status" [severity]="e.status === 'Active' ? 'success' : 'danger'"></p-tag></td>
        <td>
          <p-button icon="pi pi-pencil" [text]="true" severity="info" (onClick)="openEdit(e)" styleClass="mr-1"></p-button>
          <p-button icon="pi pi-trash" [text]="true" severity="danger" (onClick)="delete(e.id)"></p-button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr><td colspan="8" class="text-center">No employees found</td></tr>
    </ng-template>
  </p-table>

  <p-dialog [(visible)]="showDialog" [header]="editMode ? 'Edit Employee' : 'Add Employee'" [modal]="true" [style]="{ width: '480px' }">
    <div class="form-grid">
      <div class="field" *ngIf="!editMode">
        <label>Full Name</label>
        <input pInputText [(ngModel)]="form.fullName" class="w-full" />
      </div>
      <div class="field" *ngIf="!editMode">
        <label>Email</label>
        <input pInputText [(ngModel)]="form.email" class="w-full" />
      </div>
      <div class="field">
        <label>Phone</label>
        <input pInputText [(ngModel)]="form.phone" class="w-full" />
      </div>
      <div class="field">
        <label>Department</label>
        <input pInputText [(ngModel)]="form.department" class="w-full" />
      </div>
      <div class="field">
        <label>Designation</label>
        <input pInputText [(ngModel)]="form.designation" class="w-full" />
      </div>
      <div class="field">
        <label>Role</label>
        <p-select [(ngModel)]="form.role" [options]="['Employee','HRRecruiter','SeniorManager','ManagementAdmin']" class="w-full"></p-select>
      </div>
      <div class="field">
        <label>Base Salary</label>
        <p-inputnumber [(ngModel)]="form.baseSalary" mode="currency" currency="INR" locale="en-IN" class="w-full"></p-inputnumber>
      </div>
    </div>
    <ng-template pTemplate="footer">
      <p-button label="Cancel" severity="secondary" (onClick)="showDialog=false"></p-button>
      <p-button label="Save" (onClick)="save()"></p-button>
    </ng-template>
  </p-dialog>
</div>
