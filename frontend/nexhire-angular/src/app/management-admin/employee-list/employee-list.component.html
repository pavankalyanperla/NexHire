<div class="page-container">
  <div class="page-header">
    <h2>Employee Directory</h2>
  </div>

  <div class="search-bar">
    <input pInputText placeholder="Search by name, department or code..." [(ngModel)]="search" (input)="applyFilter()" class="w-full" />
  </div>

  <p-table [value]="filtered" [loading]="loading" stripedRows>
    <ng-template pTemplate="header">
      <tr>
        <th>Code</th><th>Name</th><th>Email</th><th>Department</th>
        <th>Designation</th><th>Role</th><th>Status</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-e>
      <tr>
        <td><strong>{{ e.employeeCode }}</strong></td>
        <td>{{ e.fullName }}</td>
        <td>{{ e.email }}</td>
        <td>{{ e.department }}</td>
        <td>{{ e.designation }}</td>
        <td><p-tag [value]="e.role" severity="info"></p-tag></td>
        <td><p-tag [value]="e.status" [severity]="e.status === 'Active' ? 'success' : 'danger'"></p-tag></td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr><td colspan="7" class="text-center">No employees found</td></tr>
    </ng-template>
  </p-table>
</div>
