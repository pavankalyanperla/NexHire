version: '3.8'

services:
  sql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: nexhire-sqlserver
    environment:
      SA_PASSWORD: "NexHire@SQL2026!"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - nexhire-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'NexHire@SQL2026!' -Q 'SELECT 1' -No 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  nexhire-identity:
    build:
      context: ./backend/IdentityService
      dockerfile: Dockerfile
    container_name: nexhire-identity
    ports:
      - "5100:5100"
    environment:
      - ASPNETCORE_URLS=http://+:5100
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sql-server;Database=NexHire_IdentityDB;User Id=sa;Password=NexHire@SQL2026!;TrustServerCertificate=True;
      - JwtSettings__Secret=NexHire@SuperSecretKey#2026!FWC$XyZ987
      - JwtSettings__Issuer=NexHire
      - JwtSettings__Audience=NexHireUsers
    depends_on:
      sql-server:
        condition: service_healthy
    networks:
      - nexhire-net

  nexhire-hrms:
    build:
      context: ./backend/HRMSService
      dockerfile: Dockerfile
    container_name: nexhire-hrms
    ports:
      - "5200:5200"
    environment:
      - ASPNETCORE_URLS=http://+:5200
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sql-server;Database=NexHire_HRMSDB;User Id=sa;Password=NexHire@SQL2026!;TrustServerCertificate=True;
      - JwtSettings__Secret=NexHire@SuperSecretKey#2026!FWC$XyZ987
      - JwtSettings__Issuer=NexHire
      - JwtSettings__Audience=NexHireUsers
    depends_on:
      sql-server:
        condition: service_healthy
    networks:
      - nexhire-net

  nexhire-resume-ai:
    build:
      context: ./ai-services/ResumeAI
      dockerfile: Dockerfile
    container_name: nexhire-resume-ai
    ports:
      - "8001:8001"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    networks:
      - nexhire-net

  nexhire-interview-ai:
    build:
      context: ./ai-services/InterviewAI
      dockerfile: Dockerfile
    container_name: nexhire-interview-ai
    ports:
      - "8002:8002"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    networks:
      - nexhire-net

  nexhire-recruitment:
    build:
      context: ./backend/RecruitmentService
      dockerfile: Dockerfile
    container_name: nexhire-recruitment
    ports:
      - "5300:5300"
    environment:
      - ASPNETCORE_URLS=http://+:5300
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sql-server;Database=NexHire_RecruitmentDB;User Id=sa;Password=NexHire@SQL2026!;TrustServerCertificate=True;
      - JwtSettings__Secret=NexHire@SuperSecretKey#2026!FWC$XyZ987
      - JwtSettings__Issuer=NexHire
      - JwtSettings__Audience=NexHireUsers
      - AIServices__ResumeAIUrl=http://nexhire-resume-ai:8001
      - AIServices__InterviewAIUrl=http://nexhire-interview-ai:8002
    depends_on:
      sql-server:
        condition: service_healthy
      nexhire-resume-ai:
        condition: service_started
      nexhire-interview-ai:
        condition: service_started
    networks:
      - nexhire-net

  nexhire-gateway:
    build:
      context: ./gateway/OcelotGateway
      dockerfile: Dockerfile
    container_name: nexhire-gateway
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_URLS=http://+:5000
      - ASPNETCORE_ENVIRONMENT=Production
    depends_on:
      - nexhire-identity
      - nexhire-hrms
      - nexhire-recruitment
    networks:
      - nexhire-net

  nexhire-angular:
    build:
      context: ./frontend/nexhire-angular
      dockerfile: Dockerfile
    container_name: nexhire-angular
    ports:
      - "4200:80"
    depends_on:
      - nexhire-gateway
    networks:
      - nexhire-net

volumes:
  sqlserver_data:

networks:
  nexhire-net:
    driver: bridge
